name: Build Mobile Apps (APK & IPA)

on:
  push:
    branches:
      - main
      - master
      - rewrite/localsend-rust
  workflow_dispatch:
    inputs:
      build_target:
        description: 'Plataforma para compilar'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - android
          - ios

jobs:
  # ========================================================
  # BUILD ANDROID (APK)
  # ========================================================
  build-android:
    name: Build Android APK
    if: ${{ github.event.inputs.build_target != 'ios' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK & NDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          # Detecta a versão do NDK pré-instalada no runner do GitHub
          if [ -d "$ANDROID_HOME/ndk" ]; then
            NDK_VERSION=$(ls -1 "$ANDROID_HOME/ndk" | sort -V | tail -n 1)
            echo "NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> $GITHUB_ENV
            echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> $GITHUB_ENV
            echo "Usando Android NDK: $NDK_VERSION"
          fi
          # Aceita termos de licenca
          yes | sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Tauri CLI
        run: npm install -g @tauri-apps/cli

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Cache Cargo & Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            ~/.gradle/caches/
            ~/.gradle/wrapper/
            target/
          key: ${{ runner.os }}-android-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-android-cargo-

      - name: Initialize Tauri Android (if needed)
        working-directory: ./app
        run: |
          if [ ! -d "src-tauri/gen/android" ]; then
            npx tauri android init --ci --skip-targets-install
          fi

      - name: Configure Android Permissions in AndroidManifest.xml
        run: |
          MANIFEST=$(find app/src-tauri/gen/android -name "AndroidManifest.xml" | head -n 1)
          if [ -n "$MANIFEST" ]; then
            echo "Ajustando permissões no $MANIFEST..."
            sed -i '/<manifest/a \    <uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />\n    <uses-permission android:name="android.permission.ACCESS_WIFI_STATE" />\n    <uses-permission android:name="android.permission.CHANGE_WIFI_MULTICAST_STATE" />' "$MANIFEST"
          fi

      - name: Build Android APK
        working-directory: ./app
        run: |
          chmod +x src-tauri/gen/android/gradlew || true
          npx tauri android build --ci --debug --apk

      - name: Collect APK Files
        run: |
          mkdir -p output/android
          find app/src-tauri/gen/android -name "*.apk" -exec cp {} output/android/ \;
          ls -lah output/android

      - name: Upload Android APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ducker-android-apks
          path: output/android/*.apk
          if-no-files-found: error

  # ========================================================
  # BUILD IOS (IPA / Payload)
  # ========================================================
  build-ios:
    name: Build iOS IPA
    if: ${{ github.event.inputs.build_target != 'android' }}
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Tauri CLI
        run: npm install -g @tauri-apps/cli

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,x86_64-apple-ios,aarch64-apple-ios-sim

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-ios-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-ios-cargo-

      - name: Initialize Tauri iOS (if needed)
        working-directory: ./app
        run: |
          if [ ! -d "src-tauri/gen/apple" ]; then
            npx tauri ios init --ci --skip-targets-install
          fi

      - name: Build iOS Application (Unsigned)
        working-directory: ./app
        run: |
          npx tauri ios build --ci --debug --no-sign

      - name: Package IPA (AltStore / Sideloadly Compatible)
        run: |
          mkdir -p output/ios/Payload
          APP_DIR=$(find app/src-tauri/gen/apple -name "*.app" -type d | head -n 1)
          echo "Diretório app encontrado: $APP_DIR"
          if [ -n "$APP_DIR" ]; then
            cp -R "$APP_DIR" output/ios/Payload/
            cd output/ios
            zip -r Ducker-iOS-unsigned.ipa Payload
            cd ../..
          else
            echo "Nenhum diretório .app encontrado!"
            exit 1
          fi

      - name: Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ducker-ios-ipa
          path: output/ios/Ducker-iOS-unsigned.ipa
          if-no-files-found: error
