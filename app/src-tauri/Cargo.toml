[package]
name = "ducker-app"
version = "0.2.0"
edition = "2021"
description = "Ducker GUI app implementing LocalSend v2 (Tauri v2)"

[lib]
name = "ducker_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "ducker-app"
path = "src/main.rs"

[dependencies]
ducker-core = { path = "../../core" }
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
dirs = "5.0"

[build-dependencies]
tauri-build = { version = "2", features = [] }
