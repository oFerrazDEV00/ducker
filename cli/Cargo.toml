[package]
name = "ducker-cli"
version = "0.1.0"
edition = "2021"
description = "Command line interface for Ducker"

[[bin]]
name = "ducker"
path = "src/main.rs"

[dependencies]
ducker-core = { path = "../core" }
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive"] }
indicatif = "0.17"
dialoguer = "0.11"
console = "0.15"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dirs = "5.0"
