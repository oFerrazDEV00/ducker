[package]
name = "ducker-core"
version = "0.1.0"
edition = "2021"
description = "Core library for Ducker local-first file transfer protocol"

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rand = "0.8"
thiserror = "2.0"
dirs = "5.0"
axum = { version = "0.7", features = ["ws"] }
tower-http = { version = "0.6", features = ["cors"] }
futures-util = "0.3"
tracing = "0.1"

[dev-dependencies]
tempfile = "3"
